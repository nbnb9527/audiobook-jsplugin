name: Build audiobook plugin

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jsc compiler (QuickJS bytecode)
        run: npm install @songloft/jsc-win32-x64@2.15.0

      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "PLUGIN_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build plugin package
        env:
          JSC_EXE: node_modules/@songloft/jsc-win32-x64/bin/jsc.exe
        run: python build.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-jsplugin
          path: dist/audiobook.jsplugin.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/audiobook.jsplugin.zip
          generate_release_notes: true
